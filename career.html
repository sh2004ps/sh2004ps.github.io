  <main class="site-shell career-page">
    <header class="career-hero">
      <h1>Career</h1>
      <p>지금까지의 성장 과정과 활동, 수상 경력을 한 곳에 정리했습니다.</p>
    </header>

    <section class="section journey-section reveal-section" id="journey" aria-labelledby="careerJourneyTitle">
      <div class="section-heading">
        <h2 id="careerJourneyTitle">Journey</h2>
      </div>
      <div class="journey-list" data-journey-list>
        <button class="reveal-wrapper journey-card hover-card clickable-card reveal-card" type="button" data-journey-card aria-expanded="false">
          <span class="journey-card-surface hover-card-surface acrylic-panel tone-blue">
            <span class="journey-summary"><time>2004년 3월</time><strong>서울아산병원 출생</strong></span>
            <span class="journey-story"><span>서울아산병원에서 태어나 성장의 첫 시작을 맞이했습니다. 이 시기는 지금의 저를 이루는 출발점이며, 이후 다양한 경험을 쌓아가는 기반이 되었습니다.</span></span>
          </span>
        </button>
        <button class="reveal-wrapper journey-card hover-card clickable-card reveal-card" type="button" data-journey-card aria-expanded="false">
          <span class="journey-card-surface hover-card-surface acrylic-panel tone-mint">
            <span class="journey-summary"><time>2011년 2월</time><strong>열방교회 부설 예꿈어린이집 졸업</strong></span>
            <span class="journey-story"><span>어린이집 시절에는 새로운 환경에서 친구들과 어울리고 기본적인 생활 습관을 익히며 사회성을 배웠습니다. 작은 경험들이 모여 이후 학교생활에 적응하는 데 도움이 되었습니다.</span></span>
          </span>
        </button>
        <button class="reveal-wrapper journey-card hover-card clickable-card reveal-card" type="button" data-journey-card aria-expanded="false">
          <span class="journey-card-surface hover-card-surface acrylic-panel tone-green">
            <span class="journey-summary"><time>2017년 2월</time><strong>동백초등학교 졸업</strong></span>
            <span class="journey-story"><span>초등학교 시절 컴퓨터 방과후 수업에서 스크래치를 접하며 프로그래밍에 처음 관심을 가지게 되었습니다. 블록을 조립하듯 명령을 만들고 결과가 화면에 나타나는 경험은 기술이 생각을 현실로 바꿀 수 있다는 흥미로 이어졌습니다.</span></span>
          </span>
        </button>
        <button class="reveal-wrapper journey-card hover-card clickable-card reveal-card" type="button" data-journey-card aria-expanded="false">
          <span class="journey-card-surface hover-card-surface acrylic-panel tone-lavender">
            <span class="journey-summary"><time>2020년 2월</time><strong>용인백현중학교 졸업</strong></span>
            <span class="journey-story"><span>중학교 시절에는 관심사가 조금씩 넓어지며 내가 좋아하는 분야와 잘 맞는 활동이 무엇인지 탐색했습니다. 기술과 콘텐츠, 문제 해결에 대한 호기심이 자연스럽게 커지기 시작했습니다.</span></span>
          </span>
        </button>
        <button class="reveal-wrapper journey-card hover-card clickable-card reveal-card" type="button" data-journey-card aria-expanded="false">
          <span class="journey-card-surface hover-card-surface acrylic-panel tone-peach">
            <span class="journey-summary"><time>2023년 2월</time><strong>용인성지고등학교 졸업</strong></span>
            <span class="journey-story"><span>고등학생 시절 IT 업계에 본격적으로 관심을 가지게 되었습니다. 기술이 다양한 산업과 사람들의 생활을 바꿀 수 있다는 점에 매력을 느꼈고, 이 관심이 전공 선택으로 이어졌습니다.</span></span>
          </span>
        </button>
        <button class="reveal-wrapper journey-card hover-card clickable-card reveal-card" type="button" data-journey-card aria-expanded="false">
          <span class="journey-card-surface hover-card-surface acrylic-panel tone-sky">
            <span class="journey-summary"><time>2023년 3월 ~ 현재</time><strong>순천향대학교 사물인터넷학과 재학 중</strong></span>
            <span class="journey-story"><span>순천향대학교 사물인터넷학과에서 IoT, 소프트웨어, 데이터 활용 분야를 배우고 있습니다. 전공 공부와 창업 활동을 통해 기술 자체뿐 아니라 아이디어를 서비스로 구체화하는 과정에도 관심을 가지게 되었습니다. 현재는 인투충남 개발, NEXTWAVE 활동 등을 통해 기획과 개발, 협업 경험을 쌓아가고 있습니다.</span></span>
          </span>
        </button>
      </div>
    </section>

    <section id="awards" class="section career-awards-section reveal-section" aria-labelledby="careerAwardsTitle">
      <article class="acrylic-panel career-awards-card tone-peach reveal-card">
        <h2 id="careerAwardsTitle">Awards</h2>
        <p class="career-award-content">
          <span>순천향대학교 창업동아리 아이디어리그 경진대회 스타트업 Track 1 동상 수상</span>
          <strong class="career-award-team">Team 인투로컬</strong>
        </p>
      </article>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
